# =====================================================================================================================
# FINANCIAL DOCUMENTS (bank statements, ITRs): how each PDF PAGE is routed -- its own text layer, or OCR.
# shared/bank_statement/inspect.py reads these; nothing in the code holds a number of its own.
#
# WHY PER PAGE (Phase 0 audit, docs/financial_documents/PHASE0_AUDIT.md, G1-G3): a statement was routed by counting the
# pages with >= 60 characters. A scan with a typed header / stamp passed as digital, and a statement with 9 digital
# pages and 1 scanned one was "DIGITAL" -- the scanned page was never read and its transactions were missing.
# =====================================================================================================================
page_routing:
  # a page with fewer characters than this in its text layer has no usable text layer: OCR
  min_chars: 60
  # a page whose embedded images cover at least this share of it ...
  image_coverage_min: 0.60
  # ... and whose text layer holds fewer characters than this is a SCAN with a typed header / stamp: OCR
  text_chars_with_image: 400
  # a text layer with fewer printable characters than this share is garbage (a broken font map): OCR
  printable_ratio_min: 0.85
  # an image narrower or lower than this (points) is a logo / signature, not a page image
  min_image_side_pt: 72

# ITR-V acknowledgement (app/agents/itr/extract.py): its own arithmetic, checked before anything is accepted
itr:
  # (Total tax, interest and fee payable) - (Taxes paid) must equal (Tax payable / (-) refundable) within this many
  # rupees; a larger difference is a misread or an inconsistent document: REVIEW, never a silent correction
  reconciliation_tolerance_rupees: 1
