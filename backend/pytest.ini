[pytest]
asyncio_mode = auto
markers =
    ocr: runs real OCR against sample documents (slow; excluded with -m "not ocr")
    slow: takes more than a few seconds
    live_llm: composes with the REAL local model; skipped unless LOS_LIVE_LLM_TESTS=1 and Ollama is reachable
    live_pg: runs the repository contract on a REAL PostgreSQL; skipped unless LOS_TEST_PG_DSN is set
    live_jev: calls the REAL JEV provider; skipped unless JEV_LIVE_TESTS=1
# every agent keeps its tests in its own folder
testpaths = agents/eligibility/tests agents/docs_policy/tests agents/dedupe/tests agents/bank_verification/tests agents/crime_verification/tests agents/legal_verification/tests agents/residence_office_verification/tests agents/property_valuation/tests agents/fraud_screening/tests agents/collateral_verification/tests agents/itr_verification/tests shared/tests
python_files = test_*.py
addopts = --strict-markers
